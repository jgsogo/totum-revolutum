[package]
name = "syncronia"
version = "0.1.0"
edition = "2021"

[features]
test_utils = ["dep:httpmock", "dep:tempfile"]
cli = ["dep:clap-verbosity-flag", "dep:log", "dep:tracing-subscriber", "dep:home", "dep:clap"]

[dependencies]
pcloud-sdk = { path = "../pcloud_sdk" }
filesystem = { path = "../filesystem", features = ["diff", "local"] }
filesystem-pcloud = { path = "../filesystem-pcloud" }

fs4 = { version = "0.6" }
confy = { version = "0.5", default-features = false, features = ["yaml_conf"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tracing = { version = "0.1" }
time = { version = "0.3", features = [
    "serde",
    "parsing",
    "formatting",
    "macros",
] }
# tokio-cron-scheduler = { version = "0.8" }
cron-parser = "0.7.10"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.8" }
path-clean = { version = "1.0" }
tokio = { version = "1.25", features = ["full"] }
anyhow = { version = "1.0" }
thiserror = "1.0"
ignore = "0.4"
async-trait = "0.1"
flume = "0.10.14"
sha256 = "1.1"
futures = "0.3"
async-std = "1.12"

# Optional dependencies
httpmock = { version = "0.6", optional = true }
tempfile = { version = "3.3", optional = true }

# Deps for CLI
clap = { version = "4.1", features = ["derive"], optional = true }
clap-verbosity-flag = { version = "2.0.0", optional = true }
log = { version = "0.4", optional = true }
tracing-subscriber = { version = "0.3", optional = true }
home = { version = "0.5.4", optional = true }

[dev-dependencies]
tempfile = "3"
pcloud-sdk = { path = "../pcloud_sdk", features = ["test_utils"] }
syncronia = { path = ".", features = ["test_utils"] }


[[bin]]
name = "scr"
path = "src/cli/main.rs"
# Waiting for https://github.com/rust-lang/rfcs/pull/3374
required-features = ["cli"]
