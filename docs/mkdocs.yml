site_name: Totum Revolutum - Bazel Rules Documentation
site_description: Documentation for custom Bazel rules and macros
site_author: Your Name
repo_url: https://github.com/yourusername/totum-revolutum
repo_name: totum-revolutum

theme:
  name: material
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - awesome-pages

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Bazel Rules:
    - Overview: bazel/index.md
    - Core Utilities:
      - dedent: bazel/dedent.md
      - run_copy_to_workspace: bazel/run_copy_to_workspace.md
      - sh_with_runfiles_binary: bazel/sh_with_runfiles_binary.md
    - Rust Rules:
      - rust_library_tests_and_docs: bazel/rust/defs.md
      - rust_docs: bazel/rust/docs/defs.md
      - Diesel:
        - diesel_print_schema: bazel/rust/diesel/diesel_print_schema.md
        - diesel_setup: bazel/rust/diesel/diesel_setup.md
    - Container Rules:
      - with_postgres_run: bazel/containers/postgres/with_postgres_run.md
  - Contributing:
    - Adding Documentation: bazel/docs/README.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yourusername/totum-revolutum

