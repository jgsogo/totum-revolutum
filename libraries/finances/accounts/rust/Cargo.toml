[package]
name = "finances_accounts"
version = "0.0.1"
edition = "2021"

[features]
default = ["postgres"]
postgres = ["dep:bigdecimal", "diesel/numeric", "diesel/postgres"]
test_utils = ["dep:diesel_migrations", "dep:anyhow", "dep:tempfile"]

[dependencies]
chrono = { workspace = true }
diesel = { workspace = true, features = ["r2d2", "chrono"] }
dirs = { workspace = true }
home = { workspace = true }
log = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Optional deps
bigdecimal = { workspace = true, optional = true }
diesel_migrations = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

[dev-dependencies]
finances_accounts = { path = ".", default-features = false, features = ["test_utils"] }
