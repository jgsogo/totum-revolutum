[package]
name = "pcloud_sdk"
version = "0.1.0"
edition = "2021"

[features]
### The `cli` feature is required for the CLI binary. It also provides structs and methods to handle and
### store app authentication.
cli = ["indicatif"]
indicatif = []
test_utils = []


[dependencies]
bytes = {workspace = true}
tokio = { workspace = true, features = ["full"] }
hyper = { workspace = true, features = ["full"] }
dirs = { workspace = true }
http = {workspace = true}
http-body = {workspace = true}
futures = {workspace = true}
futures-util = { workspace = true, default-features = false, features = ["alloc"] }
url = {workspace = true}
serde = { workspace = true, features = ["derive"] }
serde_json = {workspace = true}
serde_repr = {workspace = true}
async-trait = {workspace = true}
reqwest = { workspace = true, features = ["stream"] }
thiserror = {workspace = true}
time = { workspace = true, features = [
    "serde",
    "parsing",
    "formatting",
    "macros",
] }
strum = { workspace = true, features = ["derive"] }
strum_macros = {workspace = true}
chrono = { workspace = true, features = ["serde"] }
chrono-tz = { workspace = true }
cron-parser = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
bitflags = {workspace = true}
itertools = {workspace = true}
camino = { workspace = true, features = ["serde1"] }

# Optional dependencies
indicatif = {workspace = true }
mockall = { workspace = true }
httpmock = { workspace = true }

# Deps for CLI
clap-verbosity-flag = { workspace = true  }
tracing-subscriber = { workspace = true }
log = { workspace = true }
clap = { workspace = true, features = ["derive"] }

[dev-dependencies]
tempfile = {workspace = true}
env_logger = {workspace = true}
tracing-subscriber = {workspace = true}
pcloud_sdk = { path = ".", features = ["test_utils"] }

[[bin]]
name = "pcloud_sdk"
path = "src/cli/main.rs"
# Waiting for https://github.com/rust-lang/rfcs/pull/3374
required-features = ["cli"]
