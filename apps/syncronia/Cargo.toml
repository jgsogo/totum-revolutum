[package]
name = "syncronia"
version = "0.1.0"
edition = "2021"

[features]
### The `cli` feature is required for the CLI binary. It also provides structs and methods to handle and
### store app authentication. We need to add it ot the "default" features as they are the ones enabled
### while building the CLI "binary"
default = ["cli"]
test_utils = ["dep:httpmock", "dep:tempfile"]
cli = ["dep:clap-verbosity-flag", "dep:log", "dep:tracing-subscriber", "dep:home", "dep:clap"]

[dependencies]
pcloud_sdk = { path = "../../libraries/pcloud_sdk" }
cron = { path = "../../libraries/cron" }
filesystem = { path = "../../libraries/filesystem", features = ["local", "pcloud"] }

fs4 = { workspace = true }
confy = { workspace = true, default-features = false, features = ["yaml_conf"] }
camino = { workspace = true, features = ["serde1"] }
flume = { workspace = true }
ignore-files = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yml = { workspace = true }
tracing = { workspace = true }
time = { workspace = true, features = [
    "serde",
    "parsing",
    "formatting",
    "macros",
] }
cron-parser = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
chrono-tz = { workspace = true }
tokio = { workspace = true, features = ["full"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
ignore = { workspace = true }
async-trait = { workspace = true }
sha256 = { workspace = true }
futures = { workspace = true }
async-std = { workspace = true }

# Optional dependencies
httpmock = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

# Deps for CLI
clap = { workspace = true, features = ["derive"], optional = true }
clap-verbosity-flag = { workspace = true, optional = true }
log = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
home = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
pcloud_sdk = { path = "../../libraries/pcloud_sdk", features = ["test_utils"] }
syncronia = { path = ".", features = ["test_utils"] }


[[bin]]
name = "scr"
path = "src/cli/main.rs"
# Waiting for https://github.com/rust-lang/cargo/issues/4663 (and related: https://github.com/rust-lang/rfcs/pull/3374)
required-features = ["cli"]
