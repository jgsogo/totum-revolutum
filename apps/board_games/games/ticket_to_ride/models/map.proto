syntax = "proto3";
package board_games.ticket_to_ride;

import "apps/board_games/games/ticket_to_ride/models/colors.proto";


message RouteDefinition {
  uint32 id = 1;
  uint32 city_a = 2;
  uint32 city_b = 3;

  oneof route_color {
    Color color = 4;
    bool any = 5;   // GREY = any color
  }
  uint32 length = 6;        // 1..6
  bool is_tunnel = 7;       // for Europe, false in USA
  bool is_second_route = 8; // true for the second parallel edge
}

message MapDefinition {
  string name = 1;              // e.g. "USA", "Europe"
  repeated string cities = 2;   // names indexed by city id
  repeated RouteDefinition routes = 3; // static, referenced by route_id
}
