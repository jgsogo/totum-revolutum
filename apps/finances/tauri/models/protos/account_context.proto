syntax = "proto3";
package finances_app_models;

import "apps/finances/tauri/models/protos/account.proto";
import "apps/finances/tauri/models/protos/movement.proto";
import "apps/finances/tauri/models/protos/snapshot.proto";

// Data available for the selected account
message AccountContext {
    Account account = 1;

    repeated Movement movements = 2;
    repeated Snapshot snapshots = 3;
}
