[package]
name = "finances-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[features]
default = ["postgres"]
# sqlite = ["finances_db/sqlite", "diesel/sqlite", "diesel/returning_clauses_for_sqlite_3_35"]
postgres = ["finances_accounts/postgres", "finances_investments/postgres", "diesel/postgres", "diesel/numeric"]

[lib]
name = "finances_app_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
# tauri-build = { version = "2.2.0", features = [], path = "/Users/jgsogo/personal/tauri/crates/tauri-build" }
tauri-build = { version = "2.2.0", features = [] }
tar = { version  = "0.4.44"}
flate2 = { version = "1.1.1" }
serde_json = { version = "1.0.140"}
anyhow = { version = "*"}

[dependencies]
finances_accounts = { path = "../../../../libraries/finances/accounts/rust"}
finances_investments = { path = "../../../../libraries/finances/investments/rust" }
openexchangerates = { path = "../../../../libraries/openexchangerates" }
finances-app-models = { path = "../models" }

bigdecimal = "0.4.7"
camino = "1.1.9"
chrono = { version = "0.4.39" }
chrono-tz = { version = "0.10.1" }
diesel = { version = "2.2.10", features = ["r2d2", "chrono"] }

# FIXME: These are build-dependencies - If I don't list it here, Bazel doesn't include it in crate_libraries
# tauri-build = { version = "2.2.0", features = [], path = "/Users/jgsogo/personal/tauri/crates/tauri-build" }
tauri-build = { version = "2.2.0", features = [] }
tar = { version  = "0.4.44"}
flate2 = { version = "1.1.1" }

tauri = { version = "2.5.1", features = ["custom-protocol"] }
tauri-plugin-log = "2.4.0"
tauri-plugin-shell = "2.2.1"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
thiserror = "2.0.11"
log = "0.4.25"
itertools = "0.14.0"

[dev-dependencies]
finances_accounts = { path = "../../../../libraries/finances/accounts/rust", features = ["postgres", "test_utils"] }
finances_investments = { path = "../../../../libraries/finances/investments/rust", features = ["postgres"] }
finances-app = { path = ".", default-features = false, features = ["postgres"] }
tauri = { version = "2.2.5", features = ["test"] }
