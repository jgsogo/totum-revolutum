[package]
name = "finances_db"
version = "0.0.1"
edition = "2021"

[lib]
name = "finances_db"
path = "src/lib.rs"

[features]
default = []
sqlite = ["diesel/returning_clauses_for_sqlite_3_35", ]
postgres = ["dep:bigdecimal", "diesel/numeric", "diesel/postgres"]
test_utils = ["dep:diesel_migrations", "dep:anyhow", "dep:tempfile"]

[dependencies]
bigdecimal = { workspace = true, optional = true }
chrono = { workspace = true }
diesel = { workspace = true, features = ["r2d2", "chrono"] }
dirs = { workspace = true }
home = { workspace = true }
log = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

diesel_migrations = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

[dev-dependencies]
finances_db = { path = ".", default-features = false, features = ["sqlite", "test_utils"] }
