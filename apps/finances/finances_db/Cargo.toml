[package]
name = "finances_db"
version = "0.0.1"
edition = "2021"

[lib]
name = "finances_db"
path = "src/lib.rs"

[features]
default = ["postgres"]
sqlite = ["diesel/returning_clauses_for_sqlite_3_35",]
postgres = ["dep:bigdecimal", "diesel/numeric", "diesel/postgres"]

[dependencies]
bigdecimal = {workspace = true, optional = true}
chrono = { workspace = true }
diesel = { workspace = true, features = ["r2d2", "chrono"] }
dirs = { workspace = true }
home = { workspace = true }
log = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
finances_db = { path = ".", default-features = false, features = ["sqlite"] }

anyhow = { workspace = true }
diesel_migrations = { workspace = true }
tempfile = { workspace = true }
