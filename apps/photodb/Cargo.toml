[package]
name = "photodb"
version = "0.1.0"
edition = "2021"

[features]

[dependencies]
filesystem = { path = "../../libraries/filesystem", features = ["local_temp", "pcloud"] } # pcloud only required for the binary?
pcloud_sdk = { path = "../../libraries/pcloud_sdk" }

anyhow = { workspace = true }
async-trait = { workspace = true }
camino = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive"] }
clap-verbosity-flag = { workspace = true }
data-encoding = { workspace = true }
diesel = { workspace = true, features = ["sqlite", "r2d2", "returning_clauses_for_sqlite_3_35"] }
diesel_migrations = { workspace = true, features = ["sqlite"] }
dirs = { workspace = true }
dotenvy = { workspace = true }
home = { workspace = true }
image = { workspace = true }
log = { workspace = true }
oxipng = { workspace = true }
ring = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[[bin]]
name = "photodb"
