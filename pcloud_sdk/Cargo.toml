[package]
name = "pcloud-sdk"
version = "0.1.0"
edition = "2021"

[features]
### The `cli` feature is required for the CLI binary. It also provides structs and methods to handle and
### store app authentication.
cli = ["dep:clap-verbosity-flag", "dep:tracing-subscriber", "dep:log", "dep:clap", "indicatif"]

indicatif = ["dep:indicatif"]
test_utils = ["dep:mockall", "dep:httpmock"]


[dependencies]
bytes = "1"
#clap = { version = "3.2" }
#clap-verbosity-flag = { version = "1.0" }
tokio = { version = "1.26", features = ["full"] }
hyper = { version = "0.14", features = ["full"] }
dirs = { version = "4.0" }
http = "0.2"
http-body = "0.4"
futures = "0.3"
futures-util = { version = "0.3", default-features = false, features = [
    "alloc",
] }
url = "2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_repr = "0.1"
async-trait = "0.1"
reqwest = { version = "0.11", features = ["stream"] }
thiserror = "1.0"
time = { version = "0.3", features = [
    "serde",
    "parsing",
    "formatting",
    "macros",
] }
strum = { version = "0.24", features = ["derive"] }
strum_macros = "0.24"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.8" }
cron-parser = "0.7.10"
anyhow = { version = "1.0" }
tracing = { version = "0.1" }
bitflags = "1.3"
itertools = "0.10.5"
camino = { version = "1.1", features = ["serde1"] }

# Optional dependencies
indicatif = { version = "0.17", optional = true }
mockall = { version = "0.11", optional = true }
httpmock = { version = "0.6", optional = true }

# Deps for CLI
clap-verbosity-flag = { version = "2.0.0", optional = true }
tracing-subscriber = { version = "0.3", optional = true }
log = { version = "0.4", optional = true }
clap = { version = "4.1", features = ["derive"], optional = true }

[dev-dependencies]
tempfile = "3.4"
env_logger = "0.10"
tracing-subscriber = "0.3"
pcloud-sdk = { path = ".", features = ["test_utils"] }

[[example]]
name = "fileops"
required-features = ["indicatif"]

[[bin]]
name = "pcloud-sdk"
path = "src/cli/main.rs"
# Waiting for https://github.com/rust-lang/rfcs/pull/3374
required-features = ["cli"]
