[package]
name = "pcloud-sdk"
version = "0.1.0"
edition = "2021"

[features]
default = ["cli"]
cli = ["indicatif"]
examples = ["indicatif"]

[dependencies]
bytes = "1"
clap = { version = "3.2" }
clap-verbosity-flag = { version = "1.0" }
tokio = { version = "1.21", features = ["full"] }
hyper = { version = "0.14", features = ["full"] }
hyper-tls = "0.5.0"
dirs = { version = "4.0" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
http = "0.2"
http-body = "0.4"
futures = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
url = "2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
indicatif = { version = "0.17", optional = true }

[[bin]]
name = "pcloud"
required-features = ["cli"]

[[example]]
name = "upload_pb"
required-features = ["examples"]
