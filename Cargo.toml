[workspace]
resolver = "2"
members = [
    "apps/finances/tauri/src-tauri",
    "apps/finances/tauri/models",
    "apps/photodb",
    "apps/syncronia",
    "libraries/cron",
    "libraries/conductus",
    "libraries/constants",
    "libraries/diesel_utils",
    "libraries/filesystem",
    "libraries/finances/accounts/rust",
    "libraries/finances/investments/rust",
    "libraries/googleapis",
    "libraries/openexchangerates",
    "libraries/pcloud_sdk",
    "libraries/rebrickable",
    "libraries/rust/proto_wrapper",
    "libraries/rust/proto_wrapper_derive",
    "libraries/utils",
    # A placeholder to depend on _external_ crates (see [this note](./notes/2024-05-04-1923.md))
    "bazel/external",
    # Sandbox ones
]


# List all the dependencies. In the Bazel world we need all the dependencies here
# so they are available in the crate_universe.
[workspace.dependencies]
anyhow = "1.0.96"
async-std = { version = "1.13" }
async-trait = "0.1.86"
bigdecimal = "0.4.7"
bitflags = "2.9"
bytes = "1.10.0"
camino = "1.1.9"
camino-tempfile = "1.1.1"
chrono = { version = "0.4.39" }
chrono-tz = { version = "0.10.1" }
clap = { version = "4.5.31", features = ["cargo", "string"] }
clap_complete = "4.5.46"
clap-verbosity-flag = { version = "3.0.2" }
confy = { version = "2.0.0", default-features = false, features = [
    "yaml_conf",
] }
cron-parser = "0.10.0"
data-encoding = "2.8.0"
diesel = { version = "2.2.7", default-features = false, features = [
    "sqlite",
    "r2d2",
] }
diesel_migrations = { version = "2.2.0", default-features = false, features = [
    "sqlite",
] }
diesel_table_macro_syntax = "0.3.0"
diffy = "0.4.2"
dirs = { version = "6.0.0" }
dotenvy = "0.15.7"
dyn-clone = "1.0.18"
env_logger = "0.11.6"
fd-lock = "4.0.2"
kamadak-exif = "0.6.1"
flate2 = { version = "1.1.1" }
flume = "0.11.1"
fs4 = { version = "0.13.0" }
futures = { version = "0.3.31" }
futures-util = { version = "0.3.31", default-features = false }
headers = { version = "0.4.0" }
heck = { version = "0.5.0" }
home = { version = "0.5.11" }
http = "1.3.1"
http-body = "1.0.1"
http-body-util = "0.1.2"
httpmock = { version = "0.8" }
hyper = { version = "1.6.0" }
hyper-util = { version = "0.1.18" }
ignore = { version = "0.4.23" }
ignore-files = "=3.0.4"
image = { version = "0.25.5" }
indicatif = { version = "0.18.0" }
itertools = "0.14.0"
lazy_static = "1.5.0"
log = "0.4.26"
main_error = "0.1.2"
mime = "0.3.17"
mockall = { version = "0.13.1" }
num-bigint = "0.4.6"
num-traits = "0.2.19"
oxipng = { version = "9.1.4", features = [
    "parallel",
    "zopfli",
    "filetime",
], default-features = false }
pq-sys = "0.7.1"
prost = "0.14.1"
prost-types = "0.14.1"
prost-build = "0.14.1"
# protoc-gen-prost = "0.4.0"
# protoc-gen-tonic = "0.4.1"
regex = "1.11.1"
reqwest = { version = "0.12.12" }
ring = "0.17.13"
serde = { version = "1.0.218" }
serde_json = "1.0.140"
serde_regex = "1.1.0"
serde_repr = "0.1.19"
serde_yml = "0.0.12"
sha256 = { version = "1.5" }
similar-asserts = "1.7.0"
strum = "0.27.1"
strum_macros = "0.27.1"
syn = { version = "2.0.104", features = ["visit"] }
tar = { version = "0.4.44" }
tauri-build = { version = "2.2.0", features = [] }
tauri = { version = "2.5.1", features = [] }
tauri-plugin-shell = "2.2.1"
tauri-plugin-log = "2.4.0"
tempfile = { version = "3.17.1" }
testing_logger = "0.1.1"
thiserror = "2.0.12"
time = { version = "0.3.37" }
tokio = { version = "1.43" }
tokio-stream = "0.1.17"
toml = "0.9.2"
# tonic = {version = "0.12.3", features = ["transport"]}
# tonic-build = "0.12.3"
tracing = { version = "0.1.41" }
tracing-subscriber = { version = "0.3.19" }
tryhard = { version = "0.5.1" }
url = "2.5.4"
uuid = "1.14.0"
