[workspace]
resolver = "2"
members = [
    "apps/syncronia",
    "libraries/cron",
    "libraries/constants",
    "libraries/filesystem",
    "libraries/filesystem_pcloud",
    "libraries/http_utils",
    "libraries/pcloud_sdk",
    "libraries/rebrickable",
]


# List all the dependencies. In the Bazel world we need all the dependencies here
# so they are available in the crate_universe.
[workspace.dependencies]
anyhow = "1.0.82"
async-std = { version = "1.12" }
async-trait = "0.1.80"
bitflags = "2.5"
bytes = "1.6.0"
camino = "1.1"
chrono = { version = "0.4" }
chrono-tz = { version = "0.9.0" }
clap = { version = "4.5" }
clap-verbosity-flag = { version = "2.2" }
confy = { version = "0.6.1", default-features = false, features = ["yaml_conf"] }
cron-parser = "0.9.0"
dirs = { version = "5.0" }
dyn-clone = "1.0.17"
env_logger = "0.11.3"
flume = "0.11.0"
fs4 = { version = "0.8.2" }
futures = { version = "0.3" }
futures-util = { version = "0.3", default-features = false }
headers = { version = "0.4.0" }
home = { version = "0.5.9" }
http = "1.1.0"
http-body = "1.0.0"
http-body-util = "0.1.1"
httpmock = { version = "0.7" }
hyper = { version = "1.3.1" }
hyper-util = { version = "0.1.3" }
ignore = { version = "0.4" }
indicatif = { version = "0.17" }
itertools = "0.12.1"
lazy_static = "1.4.0"
log = "0.4.21"
main_error = "0.1.2"
mime = "0.3.17"
mockall = { version = "0.12.1" }
num-traits = "0.2.18"
reqwest = { version = "0.12.4" }
serde = { version = "1.0" }
serde_json = "1.0.116"
serde_repr = "0.1"
serde_yaml = "0.9"
sha256 = { version = "1.5" }
strum = "0.26.2"
strum_macros = "0.26.2"
tempfile = { version = "3.10" }
thiserror = "1.0"
time = { version = "0.3" }
tokio = { version = "1.37" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3" }
url = "2.5"
