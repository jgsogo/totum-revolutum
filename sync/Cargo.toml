[package]
name = "pcloud-sync"
version = "0.1.0"
edition = "2021"

[dependencies]
pcloud-sdk = { path = "../sdk" }
fs4 = { version = "0.6" }
confy = { version = "0.5", default-features = false, features = ["yaml_conf"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tracing = { version = "0.1" }
time = { version = "0.3", features = [
    "serde",
    "parsing",
    "formatting",
    "macros",
] }
# tokio-cron-scheduler = { version = "0.8" }
cron-parser = "0.7.10"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.8" }
path-clean = { version = "0.1" }
tokio = { version = "1.23", features = ["full"] }
anyhow = { version = "1.0" }
thiserror = "1.0"
ignore = "0.4"
async-trait = "0.1"
flume = "0.10.14"
sha256 = "1.1"
clap = { version = "4.0", features = ["derive"] }  # TODO: Require cli feature
futures = "0.3"
async-std = "1.12"

[dev-dependencies]
tempfile = "3"
pcloud-sdk = { path = "../sdk", features = ["mocks"] }
