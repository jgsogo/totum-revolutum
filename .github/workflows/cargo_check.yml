  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - uses: actions/checkout@v3
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - name: Set up cargo cache
        uses: Swatinem/rust-cache@v2
        cache-on-failure: true
        with:
          shared-key: "pcloud-sdk"

      - name: Run cargo test
        uses: actions-rs/cargo@v1
        with:
          command: test


