name: bazel-diff

# Docs:
#
# Regular build will compute the diff with a previous commit (either from `main` or from the `base` branch in PRs),
# then it will use bazel-diff tool to find the impacted targets and execute just those tests.
#
# If `[skip-diff]` is provided in the commit message it will skip the bazel-diff stuff and just run all the tests.

on:
  push:
    branches: [master]
  pull_request:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  BAZEL_CONFIG: "--config=ci"
  BAZEL_REMOTE_CACHE_URL: "grpc://bazel-remote:9092"
  BAZEL_DISK_CACHE_PATH: "~/.cache/bazel-disk-cache"

jobs:
  # This job will find out if any self-hosted runner is available and return it
  # (otherwise it returns the 'ubuntu-latest'). The purpose is to use self-hosted runners as
  # much as possible to save GitHub quota.
  #
  # Credit: https://github.com/orgs/community/discussions/20019#discussioncomment-7173595
  check-runner:
    runs-on: ubuntu-latest
    outputs:
      runner-label: ${{ steps.set-runner.outputs.runner-label }}
    steps:
      - name: Set runner
        id: set-runner
        run: |
          runners=$(curl -s -H "Accept: application/vnd.github+json" -H "Authorization: token ${{ secrets.REPO_ACCESS_TOKEN }}" "https://api.github.com/repos/${{ github.repository }}/actions/runners")
          echo "runners: $runners"
          available=$(echo "$runners" | jq '.runners[] | select(.status == "online" and .busy == false and .labels[] .name == "self-hosted")' || "")
          if [ -n "$available" ]; then
            echo "runner-label=self-hosted" >> $GITHUB_OUTPUT
          else
            echo "runner-label=ubuntu-latest" >> $GITHUB_OUTPUT
          fi

  head_commit_message:
    needs:
      - check-runner
    runs-on: ${{ needs.check-runner.outputs.runner-label }}
    outputs:
      head-commit-message: ${{ steps.get_head_commit_message.outputs.commit-message }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Print head git commit message
        id: get_head_commit_message
        run: |
          echo "commit-message=$(git show -s --format=%s)"
          echo "commit-message=$(git show -s --format=%s)" >> "$GITHUB_OUTPUT"

  compute-current-hashes:
    needs:
      # - debugging
      - check-runner
    runs-on: ${{ needs.check-runner.outputs.runner-label }}
    steps:
      - uses: actions/checkout@v5

      - name: Cache Bazel
        if: ${{ needs.check-runner.outputs.runner-label != 'self-hosted' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/bazel-disk-cache
          key: ${{ runner.os }}-bazel-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel.lock', 'Cargo.lock', 'pnpm-lock.yaml', 'bazel/third_party/requirements.lock') }}
          restore-keys: |
            ${{ runner.os }}-bazel-

      - name: Configure disk-cache
        if: ${{ needs.check-runner.outputs.runner-label != 'self-hosted' }}
        run: |
          echo "build --disk_cache=~/.cache/bazel-disk-cache" >> user.bazelrc

      - name: Configure bazel-remote
        if: ${{ needs.check-runner.outputs.runner-label == 'self-hosted' }}
        run: |
          echo "build --remote_cache=$BAZEL_REMOTE_CACHE_URL" >> user.bazelrc
          echo "build --remote_timeout=10" >> user.bazelrc
          echo "build --remote_upload_local_results" >> user.bazelrc

      - name: Generate hashes from current
        run: bazel run $BAZEL_CONFIG //bazel/diff -- generate-hashes --excludeExternalTargets -w ${{ github.workspace }} ${{ runner.temp }}/current-hashes.json

      - name: Save current-hashes as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: current-hashes.json
          path: ${{ runner.temp }}/current-hashes.json

  compute-base-hashes:
    needs:
      - head_commit_message
      - check-runner
      - compute-current-hashes
    runs-on: ${{ needs.check-runner.outputs.runner-label }}
    if: ${{ !contains(needs.head_commit_message.outputs.head-commit-message, '[skip-diff]') }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Base from base branch (PR)
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          echo "I'm a PR to base '${{ github.event.pull_request.base.ref }}'"
          git fetch origin ${{ github.event.pull_request.base.ref }}
          git worktree add ${{ runner.temp }}/base ${{ github.event.pull_request.base.ref }}

      - name: Base from previous commit (not PR)
        if: ${{ github.event_name == 'push' }}
        run: |
          echo "I'm NOT a PR"
          git worktree add ${{ runner.temp }}/base $(git rev-parse HEAD^)

      - name: Cache Bazel
        if: ${{ needs.check-runner.outputs.runner-label != 'self-hosted' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/bazel-disk-cache
          key: ${{ runner.os }}-bazel-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel.lock', 'Cargo.lock', 'pnpm-lock.yaml', 'bazel/third_party/requirements.lock') }}
          restore-keys: |
            ${{ runner.os }}-bazel-

      - name: Configure disk-cache
        if: ${{ needs.check-runner.outputs.runner-label != 'self-hosted' }}
        run: |
          echo "build --disk_cache=~/.cache/bazel-disk-cache" >> user.bazelrc

      - name: Configure bazel-remote
        if: ${{ needs.check-runner.outputs.runner-label == 'self-hosted' }}
        run: |
          echo "build --remote_cache=$BAZEL_REMOTE_CACHE_URL" >> user.bazelrc
          echo "build --remote_timeout=10" >> user.bazelrc
          echo "build --remote_upload_local_results" >> user.bazelrc

      - name: Generate hashes from base
        run: |
          bazel run $BAZEL_CONFIG //bazel/diff -- generate-hashes --excludeExternalTargets -w ${{ runner.temp }}/base ${{ runner.temp }}/base-hashes.json
          cat ${{ runner.temp }}/base-hashes.json
          rm -fr ${{ runner.temp }}/base
          git worktree prune

      - name: Save base-hashes as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: base-hashes.json
          path: ${{ runner.temp }}/base-hashes.json

      - uses: actions/download-artifact@v5
        with:
          name: current-hashes.json
          path: ${{ runner.temp }}/

      - name: Compute impacted targets
        run: bazel run $BAZEL_CONFIG //bazel/diff -- get-impacted-targets -sh ${{ runner.temp }}/base-hashes.json -fh ${{ runner.temp }}/current-hashes.json -o ${{ runner.temp }}/impacted-targets.txt

      - name: Save impacted-targets as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: impacted-targets.txt
          path: ${{ runner.temp }}/impacted-targets.txt

  # Run third-party tests (different Bazel workspaces)
  run-third-party-tests:
    needs:
      - check-runner
    runs-on: ${{ needs.check-runner.outputs.runner-label }}
    services:
      docker:
        image: ${{ needs.check-runner.outputs.runner-label != 'self-hosted' && 'docker:dind' || '' }}
        options: --privileged --shm-size=2g
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock:ro
    steps:
      - uses: actions/checkout@v5

      - name: Cache Bazel
        if: ${{ needs.check-runner.outputs.runner-label != 'self-hosted' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel-disk-cache
          key: ${{ runner.os }}-bazel-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel.lock', 'Cargo.lock', 'pnpm-lock.yaml', 'bazel/third_party/requirements.lock') }}
          restore-keys: |
            ${{ runner.os }}-bazel-

      - name: Configure disk-cache
        if: ${{ needs.check-runner.outputs.runner-label != 'self-hosted' }}
        run: |
          echo "build --disk_cache=~/.cache/bazel-disk-cache" >> user.bazelrc
          echo "test --disk_cache=~/.cache/bazel-disk-cache" >> user.bazelrc

      - name: Configure bazel-remote
        if: ${{ needs.check-runner.outputs.runner-label == 'self-hosted' }}
        run: |
          echo "build --remote_cache=$BAZEL_REMOTE_CACHE_URL" >> user.bazelrc
          echo "build --remote_timeout=10" >> user.bazelrc
          echo "build --remote_upload_local_results" >> user.bazelrc

      - name: Test @rules_qt
        run: |
          pushd third_party/@rules_qt || exit 1

          # Run all the tests ('manual' ones are only built if required)
          set +e
          bazel test $BAZEL_CONFIG --test_tag_filters=-manual --build_tag_filters=-manual //...

          # error_code 4 - Build successful but no tests were found even though testing was requested (https://bazel.build/run/scripts)
          err=$? ; if (( $err != 4 )) ; then exit $err ; fi

  # Run the tests in a Github runner
  run-impacted-tests:
    needs:
      - head_commit_message
      - check-runner
      - compute-base-hashes
    if: ${{ !contains(needs.head_commit_message.outputs.head-commit-message, '[skip-diff]') }}
    runs-on: ${{ needs.check-runner.outputs.runner-label }}
    services:
      docker:
        image: ${{ needs.check-runner.outputs.runner-label != 'self-hosted' && 'docker:dind' || '' }}
        options: --privileged --shm-size=2g
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock:ro
    steps:
      - uses: actions/checkout@v5

      - name: Install requirements for Tauri v2
        if: ${{ needs.check-runner.outputs.runner-label != 'self-hosted' }}
        # Required by Tauri v2: https://v2.tauri.app/start/prerequisites/#linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Cache Bazel
        if: ${{ needs.check-runner.outputs.runner-label != 'self-hosted' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel-disk-cache
          key: ${{ runner.os }}-bazel-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel.lock', 'Cargo.lock', 'pnpm-lock.yaml', 'bazel/third_party/requirements.lock') }}
          restore-keys: |
            ${{ runner.os }}-bazel-

      - name: Configure disk-cache
        if: ${{ needs.check-runner.outputs.runner-label != 'self-hosted' }}
        run: |
          echo "build --disk_cache=~/.cache/bazel-disk-cache" >> user.bazelrc
          echo "test --disk_cache=~/.cache/bazel-disk-cache" >> user.bazelrc

      - name: Configure bazel-remote
        if: ${{ needs.check-runner.outputs.runner-label == 'self-hosted' }}
        run: |
          echo "build --remote_cache=$BAZEL_REMOTE_CACHE_URL" >> user.bazelrc
          echo "build --remote_timeout=10" >> user.bazelrc
          echo "build --remote_upload_local_results" >> user.bazelrc

      - uses: actions/download-artifact@v5
        with:
          name: impacted-targets.txt
          path: ${{ runner.temp }}/

      - name: Test impacted targets
        run: |
          # Do not fail for next command
          set +e
          # Run all the tests ('manual' ones are only built if required)
          bazel test $BAZEL_CONFIG --test_tag_filters=-manual --build_tag_filters=-manual --target_pattern_file=${{ runner.temp }}/impacted-targets.txt

          # error_code 4 - Build successful but no tests were found even though testing was requested (https://bazel.build/run/scripts)
          err=$? ; if (( $err != 4 )) ; then exit $err ; fi

      # It's fine to build this docs target only in master. The individual ones have already been tested ('doc/tests' are building 'doc')
      - name: Build docs
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        run: bazel build $BAZEL_CONFIG //docs

      # # Clean the build cache before storing it again. We can skip this step if there was a cache-hit, as it won't cache it.
      # # FIXME: It takes too long to build the binary!!!
      # - name: Clean Bazel disk-cache
      #   if: steps.cache.outputs.cache-hit != 'true'
      #   run: |
      #     git clone --depth 1 https://github.com/bazelbuild/bazel.git bazel-gc
      #     cd bazel-gc
      #     bazel run //src/tools/diskcache:gc -- --disk_cache=~/.cache/bazel-disk-cache --max_size=2GB

  run-all-tests:
    needs:
      - head_commit_message
      - check-runner
    if: ${{ contains(needs.head_commit_message.outputs.head-commit-message, '[skip-diff]') }}
    runs-on: ${{ needs.check-runner.outputs.runner-label }}
    services:
      docker:
        image: ${{ needs.check-runner.outputs.runner-label != 'self-hosted' && 'docker:dind' || '' }}
        options: --privileged --shm-size=2g
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock:ro
    steps:
      - uses: actions/checkout@v5

      - name: Install requirements for Tauri v2
        if: ${{ needs.check-runner.outputs.runner-label != 'self-hosted' }}
        # Required by Tauri v2: https://v2.tauri.app/start/prerequisites/#linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Cache Bazel
        if: ${{ needs.check-runner.outputs.runner-label != 'self-hosted' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel-disk-cache
          key: ${{ runner.os }}-bazel-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel.lock', 'Cargo.lock', 'pnpm-lock.yaml', 'bazel/third_party/requirements.lock') }}
          restore-keys: |
            ${{ runner.os }}-bazel-

      - name: Configure disk-cache
        if: ${{ needs.check-runner.outputs.runner-label != 'self-hosted' }}
        run: |
          echo "build --disk_cache=~/.cache/bazel-disk-cache" >> user.bazelrc
          echo "test --disk_cache=~/.cache/bazel-disk-cache" >> user.bazelrc

      - name: Configure bazel-remote
        if: ${{ needs.check-runner.outputs.runner-label == 'self-hosted' }}
        run: |
          echo "build --remote_cache=$BAZEL_REMOTE_CACHE_URL" >> user.bazelrc
          echo "build --remote_timeout=10" >> user.bazelrc
          echo "build --remote_upload_local_results" >> user.bazelrc

      - name: Test all targets
        run: |
          # Do not fail for next command
          set +e
          # Run all the tests
          bazel test $BAZEL_CONFIG //...

          # error_code 4 - Build successful but no tests were found even though testing was requested (https://bazel.build/run/scripts)
          err=$? ; if (( $err != 4 )) ; then exit $err ; fi

      # It's fine to build this docs target only in master. The individual ones have already been tested ('doc/tests' are building 'doc')
      - name: Build docs
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        run: bazel build $BAZEL_CONFIG //docs
