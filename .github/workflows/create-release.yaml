name: Create Release
on:
  workflow_dispatch:
    branches:
      - master
    inputs:
      app:
        type: choice
        description: The application to tag
        options:
        - finances
        - photodb
        - syncronia
      bump_component:
        type: choice
        description: Version component to bump
        options:
        - major
        - minor
        - patch
        - prerelease

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      BAZEL_CONFIG: "--config=ci --config=stamp -c opt"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install some requirements
        # Required by Tauri v2: https://v2.tauri.app/start/prerequisites/#linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Validate the release
        id: release-validator
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Get latest release for application ${{ inputs.app }}"
          bazel run $BAZEL_CONFIG //bazel/tools/gh -- release list --exclude-drafts --json tagName,name | jq '.[].tagName' | tee  ${{ runner.temp }}/${{ inputs.app }}-releases.json
          PREV_RELEASE=$(bazel run //bazel/tools/semver:bin -- max --filter-prefix=${{ inputs.app }} $(<${{ runner.temp }}/${{ inputs.app }}-releases.json))
          echo "PREV_RELEASE=$PREV_RELEASE"

          echo "Compute new release"
          NEW_RELEASE=$(bazel run //bazel/tools/semver:bin -- bump --component ${{ inputs.bump_component }} $PREV_RELEASE)
          echo "NEW_RELEASE=$NEW_RELEASE"

          echo "NEW_RELEASE=$NEW_RELEASE" >> $GITHUB_OUTPUT
          echo "PREV_RELEASE=$PREV_RELEASE" >> $GITHUB_OUTPUT


      - name: Build the artifacts
        env:
          NEW_RELEASE: ${{ steps.release-validator.outputs.RELEASE }}
        run: |
          echo "NEW_RELEASE = $NEW_RELEASE"
          bazel query $BAZEL_CONFIG "attr('tags', 'release', '//apps/${{ inputs.app }}/...')"

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_RELEASE: ${{ steps.release-validator.outputs.NEW_RELEASE }}
          PREV_RELEASE: ${{ steps.release-validator.outputs.PREV_RELEASE }}
        run: |
          echo "NEW_RELEASE = $NEW_RELEASE"
          echo "PREV_RELEASE = $PREV_RELEASE"
          echo "Create new release ($NEW_RELEASE) and generate notes from the prev one"
          bazel run $BAZEL_CONFIG //bazel/tools/gh -- release create $NEW_RELEASE --generate-notes --notes-start-tag $PREV_RELEASE


      # - name: Upload artifacts
      #   env:
      #     GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   run: |
      #     echo "${{ inputs.release_tag }}"
      #     bazel run $BAZEL_CONFIG //bazel/tools/gh -- release upload ${{ inputs.release_tag }} <path-to-artifact>#<text>

