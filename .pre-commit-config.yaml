# Use 'pre-commit autoupdate' in the CLI to update these repositories

# Use a slightly older version of node by default
# as the default uses a very new version of GLIBC
default_language_version:
  node: 16.18.0

fail_fast: true

repos:
  # Some common pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: fix-byte-order-marker
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: end-of-file-fixer
        exclude: ".patch$|.d.ts$"
      - id: mixed-line-ending
      - id: trailing-whitespace
        exclude: ".patch$"
      # - id: check-illegal-windows-names # Introduced in next version
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: pretty-format-json
        args: [ --autofix ]
      - id: no-commit-to-branch
      - id: file-contents-sorter
        files: (\.gitignore|\.bazelignore)
        args: [ --unique ]

  # Check formatting and lint for starlark code
  - repo: https://github.com/keith/pre-commit-buildifier
    rev: 8.0.3
    hooks:
      - id: buildifier
      - id: buildifier-lint

  # Enforce that commit messages allow for later changelog generation
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.7.0
    hooks:
      # Requires that commitizen is already installed
      - id: commitizen
        stages: [ commit-msg ]

  # Lint and format SQL files
  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 3.4.0
    hooks:
      - id: sqlfluff-lint
      - id: sqlfluff-fix

  # Python
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        args:
          - "-l 100"

  - repo: https://github.com/PyCQA/flake8.git
    rev: 7.2.0
    hooks:
      - id: flake8
        exclude: "migrations/"  # Python regex
        args:
          - "--max-line-length=100"

  - repo: https://github.com/pycqa/isort
    rev: 6.0.1
    hooks:
      - id: isort
        args: ["--profile", "black"]

  # Some local scripts
  - repo: local
    hooks:
      - id: rules_lint
        name: Bazel rules_lint - Format
        language: system
        entry: bazel run //bazel/tools/format
        files: .*

      #      - id: branch-updated
      #        name: Branch up-to-date with master
      #        entry: scripts/branch_updated.sh
      #        language: script
      #        always_run: true

      # Removed, it takes too long
      # - id: cargo-check
      #   name: Run cargo check (rules_rust managed version)
      #   entry: bazel/tools/cargocheck.sh
      #   language: script
      #   pass_filenames: false
      #   files: \.rs$

      - id: bazel-check
        name: Run all Bazel targets with 'check' tag
        entry: scripts/bazel_run_targets.sh check
        language: script
        always_run: true
        require_serial: true

      - id: bazel-update
        name: Run all Bazel targets with 'update' tag (update workspace files)
        entry: scripts/bazel_run_targets.sh update
        language: script
        always_run: true
        require_serial: true
